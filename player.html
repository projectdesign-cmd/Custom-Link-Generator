<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
h1 { font-size: 18px; margin-bottom: 10px; text-align: center; padding: 10px; }
video { width: 100%; max-width: 900px; height: auto; background: #000; }
.container { width: 100%; max-width: 900px; padding: 10px; }
.error { color: red; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div class="container">
<h1 id="title">Loading...</h1>
<video id="player" controls autoplay>
  <source id="source" src="" type="video/mp4">
  Your browser does not support the video tag.
</video>
<p class="error" id="error"></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const url = params.get("url");
const title = params.get("title");
if (url) {
  document.getElementById("source").src = url;
  document.getElementById("player").load();
  document.getElementById("title").innerText = title || "Video Player";
  document.title = title || "Video Player";
} else {
  document.getElementById("title").innerText = "No video URL provided!";
  document.getElementById("error").innerText = "Please add ?url=YOUR_VIDEO_LINK to the URL";
}
</script>
</body>
</html>
