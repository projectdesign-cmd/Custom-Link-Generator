<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Player with Telegram Link</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        video {
            width: 80%;
            max-width: 800px;
            height: auto;
            background-color: #000;
        }
        .link-container {
            margin-top: 20px;
            font-size: 1.2em;
        }
        a {
            color: #00f;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Watch Video</h1>
    <video id="videoPlayer" controls autoplay>
        <source src="https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
    </video>

    <div class="link-container">
        Join our Telegram Channel: <a href="https://t.me/AllTeluguTvShowsWatchHere" target="_blank">https://t.me/AllTeluguTvShowsWatchHere</a>
    </div>

    <script>
        // Optional: dynamically set video source from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = urlParams.get('url');
        if (videoSrc) {
            document.getElementById('videoPlayer').src = videoSrc;
        }
    </script>

</body>
</html>
