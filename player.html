<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Video Player</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.video-wrap{width:100%;max-width:900px;position:relative;background:#000}
.tap-zone{position:absolute;top:0;width:40%;height:calc(100% - 44px);z-index:10;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;background:transparent}
.tap-left{left:0}
.tap-right{right:0}
.tap-indicator{position:absolute;top:45%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:bold;display:none;pointer-events:none;z-index:20}
.tap-left-ind{left:8px}
.tap-right-ind{right:8px}
.aspect-toggle{position:absolute;bottom:52px;right:8px;z-index:30;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center}
.aspect-menu{position:absolute;bottom:90px;right:8px;background:#1a1a2e;border-radius:10px;overflow:hidden;z-index:40;display:none;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.aspect-item{padding:14px 16px;font-size:14px;color:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.06)}
.aspect-item:last-child{border-bottom:none}
.aspect-item.active{background:rgba(229,9,20,0.25);color:#ff4d5e}
.aspect-item .check{color:#ff4d5e;font-weight:bold}
.info-box{width:100%;max-width:900px;padding:16px}
.file-title{font-size:20px;font-weight:bold;line-height:1.3;margin-bottom:10px}
.meta{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.size-badge{background:#333;color:#fff;font-size:13px;padding:3px 10px;border-radius:4px}
.quality{color:#aaa;font-size:14px}
.btn-dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#fff;color:#000;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;margin-bottom:10px}
.btn-tg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#229ED9;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;margin-bottom:10px}
.expired-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;width:100%}
.exp-icon{font-size:70px;margin-bottom:20px}
.exp-title{font-size:24px;font-weight:bold;color:#e50914;margin-bottom:10px}
.exp-msg{color:#aaa;margin-bottom:30px;font-size:15px}
.exp-btn{display:block;width:100%;max-width:400px;padding:14px 24px;border-radius:8px;text-decoration:none;font-size:16px;font-weight:bold;margin-bottom:10px;text-align:center}
@media screen and (orientation:landscape){
  body{flex-direction:row;align-items:flex-start;flex-wrap:wrap}
  .video-wrap{max-width:65vw;flex:1}
  .info-box{max-width:35vw;max-height:100vh;overflow-y:auto;padding:12px}
  .file-title{font-size:15px}
}
.video-wrap:-webkit-full-screen{width:100vw!important;height:100vh!important;max-width:100vw!important}
.video-wrap:fullscreen{width:100vw!important;height:100vh!important;max-width:100vw!important}
</style>
</head>
<body>

<div id="mainPlayer" style="width:100%;display:flex;flex-direction:column;align-items:center">
  <div class="video-wrap" id="videoWrap">
    <video-js id="player" class="vjs-default-skin vjs-big-play-centered"
      controls autoplay playsinline preload="auto"
      style="width:100%;min-height:220px">
    </video-js>
    <div class="tap-zone tap-left" id="tapLeft"></div>
    <div class="tap-zone tap-right" id="tapRight"></div>
    <div class="tap-indicator tap-left-ind" id="indLeft">-10s</div>
    <div class="tap-indicator tap-right-ind" id="indRight">+10s</div>
    <button class="aspect-toggle" id="aspectToggle" onclick="toggleMenu()">⛶ Aspect Ratio</button>
    <div class="aspect-menu" id="aspectMenu">
      <div class="aspect-item active" data-mode="contain" data-label="Original">Original<span class="check">✓</span></div>
      <div class="aspect-item" data-mode="1:1" data-label="1:1 Square">1:1 Square</div>
      <div class="aspect-item" data-mode="4:3" data-label="4:3 Classic">4:3 Classic</div>
      <div class="aspect-item" data-mode="16:9" data-label="16:9 Wide">16:9 Wide</div>
      <div class="aspect-item" data-mode="1.85:1" data-label="1.85:1 Cinema">1.85:1 Cinema</div>
      <div class="aspect-item" data-mode="21:9" data-label="21:9 Ultrawide">21:9 Ultrawide</div>
      <div class="aspect-item" data-mode="cover" data-label="Fill Screen">Fill Screen</div>
    </div>
  </div>

  <div class="info-box">
    <div class="file-title" id="title">Loading...</div>
    <div class="meta">
      <span class="size-badge" id="sizeBadge">HD</span>
      <span class="quality">HD</span>
    </div>
    <a id="dlbtn" class="btn-dl" href="#" target="_blank">⬇ Download</a>
    <a class="btn-tg" href="https://t.me/MadForEachOtherShow" target="_blank">📢 Join Telegram Channel</a>
  </div>
</div>

<div id="expiredPage" style="display:none;width:100%">
  <div class="expired-wrap">
    <div class="exp-icon">⏰</div>
    <div class="exp-title">Video Player Expired!</div>
    <div class="exp-msg">This video player has expired.<br>You can still download the video below!</div>
    <a id="exp-dl" class="exp-btn" href="#" target="_blank" style="background:#fff;color:#000">⬇ Download Video</a>
    <a class="exp-btn" href="https://t.me/MadForEachOtherShow" target="_blank" style="background:#229ED9;color:#fff">📢 Join Telegram Channel</a>
  </div>
</div>

<script>
try {

var params = new URLSearchParams(window.location.search);
var rawUrl = params.get("url");
var title = params.get("title") || "Video";
var size = params.get("size") || "HD";
var exp = params.get("exp");

document.getElementById("exp-dl").href = rawUrl || "#";

var isExpired = false;
if(exp){
  var now = Math.floor(Date.now()/1000);
  if(now > parseInt(exp)){
    isExpired = true;
  }
}

if(isExpired){
  document.getElementById("mainPlayer").style.display = "none";
  document.getElementById("expiredPage").style.display = "block";
} else {

  function formatSize(s){
    if(!s) return "HD";
    s = s.toString().trim();
    if(/^\d+(\.\d+)?M$/.test(s)) return s.replace("M","MB");
    if(/^\d+(\.\d+)?G$/.test(s)) return s.replace("G","GB");
    if(/^\d+(\.\d+)?K$/.test(s)) return s.replace("K","KB");
    return s;
  }

  document.getElementById("title").innerText = title;
  document.title = title;
  document.getElementById("sizeBadge").innerText = formatSize(size);
  document.getElementById("dlbtn").href = rawUrl || "#";

  var player = videojs("player", {
    sources: [{ src: rawUrl, type: "video/mp4" }],
    controls: true,
    autoplay: true,
    preload: "auto",
    fluid: true
  });

  player.on("error", function(){
    player.src({ src: "/api/proxy?url=" + encodeURIComponent(rawUrl), type: "video/mp4" });
    player.play();
  });

  var menu = document.getElementById("aspectMenu");
  var toggleBtn = document.getElementById("aspectToggle");

  window.toggleMenu = function(){
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  };

  var items = document.querySelectorAll(".aspect-item");
  for(var idx=0; idx<items.length; idx++){
    items[idx].addEventListener("click", function(){
      var mode = this.getAttribute("data-mode");
      var label = this.getAttribute("data-label");
      applyAspect(mode);
      var all = document.querySelectorAll(".aspect-item");
      for(var j=0; j<all.length; j++){
        all[j].classList.remove("active");
        all[j].innerHTML = all[j].getAttribute("data-label");
      }
      this.classList.add("active");
      this.innerHTML = label + '<span class="check">✓</span>';
      toggleBtn.innerHTML = "⛶ " + label;
      menu.style.display = "none";
    });
  }

  function applyAspect(mode){
    var v = document.querySelector(".vjs-tech");
    var wrap = document.getElementById("videoWrap");
    if(!v) return;
    v.style.width = "100%";
    v.style.height = "100%";
    v.style.objectFit = "contain";
    if(mode === "cover"){
      v.style.objectFit = "cover";
      return;
    }
    if(mode === "contain") return;
    var ratios = { "1:1":1, "4:3":4/3, "16:9":16/9, "1.85:1":1.85, "21:9":21/9 };
    var ratio = ratios[mode];
    if(!ratio) return;
    var containerW = wrap.offsetWidth;
    var containerH = wrap.offsetHeight;
    var w = containerW, h = containerW / ratio;
    if(h > containerH){ h = containerH; w = containerH * ratio; }
    v.style.width = w + "px";
    v.style.height = h + "px";
    v.style.objectFit = "fill";
  }

  document.addEventListener("click", function(e){
    if(!menu.contains(e.target) && e.target !== toggleBtn){
      menu.style.display = "none";
    }
  });

  function showInd(el){
    el.style.display = "block";
    setTimeout(function(){ el.style.display = "none"; }, 700);
  }

  var tapLCount = 0;
  var tapRCount = 0;

  document.getElementById("tapLeft").addEventListener("touchend", function(e){
    e.preventDefault();
    tapLCount++;
    if(tapLCount === 2){
      player.currentTime(Math.max(0, player.currentTime() - 10));
      showInd(document.getElementById("indLeft"));
      tapLCount = 0;
    } else {
      setTimeout(function(){
        if(tapLCount === 1){ player.paused() ? player.play() : player.pause(); }
        tapLCount = 0;
      }, 250);
    }
  });

  document.getElementById("tapRight").addEventListener("touchend", function(e){
    e.preventDefault();
    tapRCount++;
    if(tapRCount === 2){
      player.currentTime(Math.min(player.duration(), player.currentTime() + 10));
      showInd(document.getElementById("indRight"));
      tapRCount = 0;
    } else {
      setTimeout(function(){
        if(tapRCount === 1){ player.paused() ? player.play() : player.pause(); }
        tapRCount = 0;
      }, 250);
    }
  });

  window.addEventListener("orientationchange", function(){
    setTimeout(function(){ player.dimensions(document.querySelector(".video-wrap").offsetWidth, null); }, 300);
  });
  window.addEventListener("resize", function(){
    player.dimensions(document.querySelector(".video-wrap").offsetWidth, null);
  });
}

} catch(err) {
  document.body.innerHTML = "<div style='color:#fff;padding:30px;text-align:center'>Error loading player: " + err.message + "</div>";
}
</script>
</body>
</html>
