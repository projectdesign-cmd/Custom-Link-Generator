<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.container{width:100%;max-width:900px;padding:15px}
h1{font-size:15px;margin-bottom:10px;text-align:center;color:#eee;word-break:break-word}
video{width:100%;background:#000;border-radius:8px}
.btn{display:block;margin-top:8px;padding:12px;border-radius:6px;text-decoration:none;font-size:15px;text-align:center;color:#fff;width:100%}
.red{background:#e50914}.gray{background:#444}
.info{margin-top:8px;font-size:12px;color:#aaa;text-align:center}
</style>
</head>
<body>
<div class="container">
<h1 id="title">Loading...</h1>
<video id="player" controls autoplay playsinline></video>
<a id="dlbtn" class="btn red" href="#" target="_blank">⬇️ Download Video</a>
<a id="vlcbtn" class="btn gray" href="#">📱 Open in VLC</a>
<p class="info" id="info">Loading video...</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const rawUrl = params.get("url");
const title = params.get("title") || "Video Player";
document.getElementById("title").innerText = title;
document.title = title;
const video = document.getElementById("player");
const info = document.getElementById("info");

function tryPlay(src, msg) {
  video.src = src;
  video.load();
  return video.play().then(() => { info.innerText = msg; }).catch(() => {});
}

if(rawUrl) {
  document.getElementById("dlbtn").href = rawUrl;
  document.getElementById("vlcbtn").href = "vlc://" + rawUrl;
  const proxy = "/api/proxy?url=" + encodeURIComponent(rawUrl);
  tryPlay(rawUrl, "Playing directly!").catch(() => {
    info.innerText = "Trying proxy...";
    tryPlay(proxy, "Playing via proxy!").catch(() => {
      info.innerText = "Use Download or VLC button!";
    });
  });
  video.onerror = () => {
    if(video.src !== window.location.origin + proxy) {
      info.innerText = "Trying proxy...";
      tryPlay(proxy, "Playing via proxy!");
    } else {
      info.innerText = "Use Download or VLC button!";
    }
  };
} else {
  info.innerText = "No URL provided!";
}
</script>
</body>
</html>
