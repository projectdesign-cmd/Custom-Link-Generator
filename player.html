<script>
const params = new URLSearchParams(window.location.search);
const rawUrl = params.get("url");
const title = params.get("title") || "Video";
const size = params.get("size") || "HD";
const exp = params.get("exp");

document.getElementById("exp-dl").href = rawUrl || "#";

if(exp){
  const now = Math.floor(Date.now()/1000);
  if(now > parseInt(exp)){
    document.getElementById("mainPlayer").style.display = "none";
    document.getElementById("expiredPage").style.display = "block";
    throw new Error("expired");
  }
}

function formatSize(s){
  if(!s) return "HD";
  s = s.toString().trim();
  if(s.match(/^\d+(\.\d+)?M$/)) return s.replace("M","MB");
  if(s.match(/^\d+(\.\d+)?G$/)) return s.replace("G","GB");
  if(s.match(/^\d+(\.\d+)?K$/)) return s.replace("K","KB");
  return s;
}

document.getElementById("title").innerText = title;
document.title = title;
document.getElementById("sizeBadge").innerText = formatSize(size);
document.getElementById("dlbtn").href = rawUrl || "#";

const player = videojs("player", {
  sources: [{ src: rawUrl, type: "video/mp4" }],
  controls: true,
  autoplay: true,
  preload: "auto",
  fluid: true,
});

player.on("error", () => {
  player.src({ src: "/api/proxy?url=" + encodeURIComponent(rawUrl), type: "video/mp4" });
  player.play();
});

// Inject Aspect Ratio button directly into DOM after player is ready
player.on("loadedmetadata", insertAspectButton);
player.ready(() => {
  setTimeout(insertAspectButton, 500);
});

let aspectInserted = false;
function insertAspectButton(){
  if(aspectInserted) return;
  const fsBtn = document.querySelector(".vjs-fullscreen-control");
  const controlBar = document.querySelector(".vjs-control-bar");
  if(!controlBar) return;

  const btn = document.createElement("button");
  btn.className = "vjs-control vjs-button vjs-aspect-button";
  btn.title = "Aspect Ratio";
  btn.innerHTML = '<span class="vjs-icon-placeholder"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="display:block;margin:11px auto 0"><path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4"/></svg>';
  btn.onclick = toggleMenu;

  if(fsBtn){
    controlBar.insertBefore(btn, fsBtn);
  } else {
    controlBar.appendChild(btn);
  }
  aspectInserted = true;
}

const menu = document.getElementById("aspectMenu");

function toggleMenu(){
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

document.querySelectorAll(".aspect-item").forEach(item => {
  item.addEventListener("click", () => {
    const mode = item.getAttribute("data-mode");
    const label = item.getAttribute("data-label");
    applyAspect(mode);
    document.querySelectorAll(".aspect-item").forEach(i => {
      i.classList.remove("active");
      i.innerHTML = i.getAttribute("data-label");
    });
    item.classList.add("active");
    item.innerHTML = label + '<span class="check">✓</span>';
    menu.style.display = "none";
  });
});

function applyAspect(mode){
  const v = document.querySelector(".vjs-tech");
  const wrap = document.getElementById("videoWrap");
  if(!v) return;

  v.style.width = "100%";
  v.style.height = "100%";
  v.style.objectFit = "contain";

  if(mode === "cover"){
    v.style.objectFit = "cover";
    wrap.style.setProperty("--fit-mode","cover");
    return;
  }
  wrap.style.setProperty("--fit-mode","contain");

  if(mode === "contain") return;

  const ratios = { "1:1":1, "4:3":4/3, "16:9":16/9, "1.85:1":1.85, "21:9":21/9 };
  const ratio = ratios[mode];
  if(!ratio) return;

  const containerW = wrap.offsetWidth;
  const containerH = wrap.offsetHeight;
  let w = containerW, h = containerW / ratio;
  if(h > containerH){ h = containerH; w = containerH * ratio; }

  v.style.width = w + "px";
  v.style.height = h + "px";
  v.style.objectFit = "fill";
}

document.addEventListener("click", (e) => {
  if(!menu.contains(e.target) && !e.target.closest(".vjs-aspect-button")){
    menu.style.display = "none";
  }
});

function showInd(el){
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 700);
}

let tapLCount = 0;
let tapRCount = 0;

["touchend","click"].forEach(evt => {
  document.getElementById("tapLeft").addEventListener(evt, (e) => {
    if(evt === "touchend") e.preventDefault();
    tapLCount++;
    setTimeout(() => {
      if(tapLCount >= 2){
        player.currentTime(Math.max(0, player.currentTime() - 10));
        showInd(document.getElementById("indLeft"));
      } else if(tapLCount === 1){
        player.paused() ? player.play() : player.pause();
      }
      tapLCount = 0;
    }, 280);
  });

  document.getElementById("tapRight").addEventListener(evt, (e) => {
    if(evt === "touchend") e.preventDefault();
    tapRCount++;
    setTimeout(() => {
      if(tapRCount >= 2){
        player.currentTime(Math.min(player.duration(), player.currentTime() + 10));
        showInd(document.getElementById("indRight"));
      } else if(tapRCount === 1){
        player.paused() ? player.play() : player.pause();
      }
      tapRCount = 0;
    }, 280);
  });
});

window.addEventListener("orientationchange", () => {
  setTimeout(() => {
    player.dimensions(document.querySelector(".video-wrap").offsetWidth, null);
    aspectInserted = false;
    insertAspectButton();
  }, 300);
});
window.addEventListener("resize", () => {
  player.dimensions(document.querySelector(".video-wrap").offsetWidth, null);
});
                        </script>
