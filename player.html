<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.video-wrap{width:100%;max-width:900px}
.info-box{width:100%;max-width:900px;padding:16px}
.file-title{font-size:20px;font-weight:bold;line-height:1.3;margin-bottom:10px}
.meta{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.size-badge{background:#333;color:#fff;font-size:13px;padding:3px 10px;border-radius:4px}
.quality{color:#aaa;font-size:14px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.btn-view{padding:12px 6px;border:none;color:#fff;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;text-align:center}
.btn-view.active{outline:2px solid #fff}
.blue{background:#1a73e8}
.orange{background:#e57c00}
.btn-dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#fff;color:#000;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;margin-bottom:10px}
.btn-tg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#229ED9;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;margin-bottom:10px}
.btn-fs{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#1a73e8;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;border:none;cursor:pointer;margin-bottom:10px}
.btn-settings{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#333;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;border:none;cursor:pointer;margin-bottom:10px}
.settings-panel{background:#222;border-radius:8px;padding:14px;margin-bottom:10px;display:none}
.settings-panel h3{font-size:14px;color:#aaa;margin-bottom:10px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lang-btn{padding:10px;background:#333;border:none;color:#fff;border-radius:6px;text-align:center;cursor:pointer;font-size:14px;text-decoration:none;display:block}
.lang-btn.active{background:#1a73e8}
.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-btn{padding:10px;background:#333;border:none;color:#fff;border-radius:6px;text-align:left;cursor:pointer;font-size:14px}
.sub-btn.active{background:#1db954}
.vjs-tech{transition:object-fit 0.2s}
</style>
</head>
<body>
<div class="video-wrap">
  <video-js id="player" class="vjs-default-skin vjs-big-play-centered"
    controls autoplay playsinline preload="auto"
    style="width:100%;min-height:220px">
  </video-js>
</div>

<div class="info-box">
  <div class="file-title" id="title">Loading...</div>
  <div class="meta">
    <span class="size-badge" id="sizeBadge">HD</span>
    <span class="quality">HD</span>
  </div>

  <div class="btn-row">
    <button class="btn-view blue active" id="btn-contain" onclick="setFit('contain')">⬜ Best Fit</button>
    <button class="btn-view orange" id="btn-cover" onclick="setFit('cover')">▣ Fill</button>
  </div>

  <button class="btn-fs" onclick="goFullscreen()">⛶ Full Screen</button>
  <button class="btn-settings" onclick="toggleSettings()">⚙️ Settings</button>

  <div class="settings-panel" id="langPanel">
    <h3>🔊 Audio Language</h3>
    <div class="lang-grid" id="langList">
      <div style="color:#aaa;font-size:13px">No languages provided</div>
    </div>
    <h3>💬 Subtitles</h3>
    <div class="sub-list" id="subTracks">
      <div style="color:#aaa;font-size:13px">No subtitles detected</div>
    </div>
  </div>

  <a id="dlbtn" class="btn-dl" href="#" target="_blank">⬇ Download</a>
  <a class="btn-tg" href="https://t.me/MadForEachOtherShow" target="_blank">📢 Join Telegram Channel</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const rawUrl = params.get("url");
const title = params.get("title") || "Video";
const size = params.get("size") || "HD";
const langParam = params.get("langs") || "";
const activeLang = params.get("lang") || "";

document.getElementById("title").innerText = title;
document.title = title;
document.getElementById("sizeBadge").innerText = size;
document.getElementById("dlbtn").href = rawUrl || "#";

let settingsOpen = false;

const player = videojs("player", {
  sources: [{ src: rawUrl, type: "video/mp4" }],
  controls: true,
  autoplay: true,
  preload: "auto",
  fluid: true,
});

player.on("error", () => {
  player.src({ src: "/api/proxy?url=" + encodeURIComponent(rawUrl), type: "video/mp4" });
  player.play();
});

function setFit(mode){
  const v = document.querySelector(".vjs-tech");
  if(v) v.style.objectFit = mode;
  document.getElementById("btn-contain").classList.toggle("active", mode==="contain");
  document.getElementById("btn-cover").classList.toggle("active", mode==="cover");
}

function goFullscreen(){
  const wrap = document.querySelector(".video-wrap");
  if(document.fullscreenElement||document.webkitFullscreenElement){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    if(wrap.requestFullscreen) wrap.requestFullscreen();
    else if(wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    else if(document.querySelector("video").webkitEnterFullscreen) document.querySelector("video").webkitEnterFullscreen();
  }
}

function toggleSettings(){
  settingsOpen = !settingsOpen;
  document.getElementById("langPanel").style.display = settingsOpen ? "block" : "none";
}

if(langParam){
  const langDiv = document.getElementById("langList");
  langDiv.innerHTML = "";
  const langs = langParam.split(",");
  langs.forEach(l => {
    const parts = l.split("|");
    const name = parts[0].trim();
    const url = parts[1] ? parts[1].trim() : rawUrl;
    const isActive = activeLang === name || (!activeLang && langs.indexOf(l) === 0);
    const btn = document.createElement("a");
    btn.className = "lang-btn" + (isActive ? " active" : "");
    btn.innerText = "🔊 " + name;
    const newParams = new URLSearchParams(params);
    newParams.set("url", url);
    newParams.set("lang", name);
    btn.href = "?" + newParams.toString();
    langDiv.appendChild(btn);
  });
}

player.on("loadedmetadata", () => {
  const subDiv = document.getElementById("subTracks");
  const textTracks = player.textTracks();
  const subs = [];
  for(let i=0; i<textTracks.length; i++){
    if(textTracks[i].kind==="subtitles"||textTracks[i].kind==="captions") subs.push(textTracks[i]);
  }
  if(subs.length > 0){
    subDiv.innerHTML = "";
    const offBtn = document.createElement("button");
    offBtn.className = "sub-btn active";
    offBtn.innerText = "❌ Off";
    offBtn.onclick = () => {
      subs.forEach(t=>t.mode="hidden");
      document.querySelectorAll(".sub-btn").forEach(b=>b.classList.remove("active"));
      offBtn.classList.add("active");
    };
    subDiv.appendChild(offBtn);
    subs.forEach((t,i) => {
      const btn = document.createElement("button");
      btn.className = "sub-btn";
      btn.innerText = "💬 "+(t.label||"Subtitle "+(i+1));
      btn.onclick = () => {
        subs.forEach(s=>s.mode="hidden");
        t.mode="showing";
        document.querySelectorAll(".sub-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
      };
      subDiv.appendChild(btn);
    });
    document.getElementById("langPanel").style.display="block";
  }
});
</script>
</body>
</html>
