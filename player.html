<script>
const params = new URLSearchParams(window.location.search);
const rawUrl = params.get("url");
const title = params.get("title") || "Video Player";

document.getElementById("title").innerText = title;
document.title = title;

if (rawUrl) {
  const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);
  const video = document.getElementById("player");

  async function tryPlay(source) {
    try {
      video.src = source;
      video.muted = true; // Mute for auto-play
      await video.load();
      await video.play();
      console.log("Playing:", source);
      return true;
    } catch (error) {
      console.error("Error playing:", source, error);
      return false;
    }
  }

  tryPlay(rawUrl).then(success => {
    if (!success) {
      document.getElementById("info").innerText = "Direct failed. Trying proxy...";
      tryPlay(proxyUrl).then(successProxy => {
        if (!successProxy) {
          document.getElementById("info").innerText = "Use Download or Proxy Player button below!";
        }
      });
    }
  });

  document.getElementById("dlbtn").href = rawUrl;
  document.getElementById("proxybtn").href = "https://www.hlsplayer.net/play?url=" + encodeURIComponent(rawUrl);
} else {
  document.getElementById("title").innerText = "No video URL provided!";
  document.getElementById("info").innerText = "Add ?url=YOUR_VIDEO_LINK to the URL";
}
</script>
