<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; color: #fff; font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
h1 { font-size: 16px; margin-bottom: 10px; text-align: center; padding: 10px; color: #eee; }
.container { width: 100%; max-width: 900px; padding: 10px; }
.btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background: #e50914; color: #fff; border-radius: 6px; text-decoration: none; font-size: 16px; text-align: center; width: 100%; }
.btn:hover { background: #c40812; }
.info { margin-top: 10px; font-size: 13px; color: #aaa; text-align: center; }
video { width: 100%; max-width: 900px; height: auto; background: #000; border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
<h1 id="title">Loading...</h1>
<video id="player" controls autoplay controlsList="nodownload">
  Your browser does not support the video tag.
</video>
<a id="dlbtn" class="btn" href="#" target="_blank">⬇️ Download Video</a>
<p class="info">If video does not play, use the Download button</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const url = params.get("url");
const title = params.get("title") || "Video Player";
document.getElementById("title").innerText = title;
document.title = title;
document.getElementById("dlbtn").href = url;
if (url) {
  const video = document.getElementById("player");
  video.src = url;
  video.load();
  video.play().catch(() => {});
}
</script>
</body>
</html>
