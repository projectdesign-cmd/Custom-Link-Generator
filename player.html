<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Player</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.video-wrap{width:100%;max-width:900px}
.info-box{width:100%;max-width:900px;padding:16px}
.file-title{font-size:18px;font-weight:bold;line-height:1.3;margin-bottom:10px}
.meta{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.size-badge{background:#333;color:#fff;font-size:13px;padding:3px 10px;border-radius:4px}
.quality{color:#aaa;font-size:14px}
.tg-banner{display:flex;align-items:center;justify-content:space-between;background:#0088cc;border-radius:8px;padding:10px 16px;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.tg-banner span{font-size:13px;color:#fff}
.tg-banner a{background:#fff;color:#0088cc;font-size:13px;font-weight:bold;padding:6px 14px;border-radius:6px;text-decoration:none;white-space:nowrap}
.btn-dl{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#16a34a;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;margin-bottom:10px}
.btn-fit{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#1a73e8;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;border:none;cursor:pointer;margin-bottom:10px}
.btn-copy{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:#333;color:#fff;border-radius:8px;font-size:16px;font-weight:bold;border:none;cursor:pointer;margin-bottom:10px}
.settings-panel{background:#222;border-radius:8px;padding:14px;margin-bottom:10px}
.settings-panel h3{font-size:14px;color:#aaa;margin-bottom:10px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lang-btn{padding:10px;background:#333;border:none;color:#fff;border-radius:6px;text-align:center;cursor:pointer;font-size:14px;text-decoration:none;display:block}
.lang-btn.active{background:#1a73e8}
.sub-list{display:flex;flex-direction:column;gap:6px}
.sub-btn{padding:10px;background:#333;border:none;color:#fff;border-radius:6px;text-align:left;cursor:pointer;font-size:14px}
.sub-btn.active{background:#1db954}
video.fit{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999;object-fit:contain;background:#000}
</style>
</head>
<body>

<div class="video-wrap">
  <video-js id="player" class="vjs-default-skin vjs-big-play-centered"
    controls autoplay playsinline preload="auto"
    style="width:100%;min-height:220px">
  </video-js>
</div>

<div class="info-box">
  <div class="file-title" id="title">Loading...</div>
  <div class="meta">
    <span class="size-badge" id="sizeBadge">Detecting...</span>
    <span class="quality" id="qualityBadge"></span>
  </div>

  <div class="tg-banner">
    <span>📺 Watch All Telugu TV Shows</span>
    <a href="https://t.me/AllTeluguTvShowsWatchHere" target="_blank">➤ Join Telegram</a>
  </div>

  <a id="dlbtn" class="btn-dl" href="#" target="_blank">⬇ Download</a>
  <button class="btn-copy" id="copyBtn" onclick="copyLink()">📋 Copy Direct Link</button>
  <button class="btn-fit" onclick="toggleFit()">⛶ Fit to Screen</button>

  <div class="settings-panel" id="langPanel" style="display:none">
    <h3>🔊 Audio Language</h3>
    <div class="lang-grid" id="langList"></div>
    <h3>💬 Subtitles</h3>
    <div class="sub-list" id="subTracks">
      <div style="color:#aaa;font-size:13px">No subtitles detected</div>
    </div>
  </div>
</div>

<script>
var params = new URLSearchParams(window.location.search);
var rawUrl = params.get("url");
var title = params.get("title") || "Video";
var sizeParam = params.get("size") || "";
var langParam = params.get("langs") || "";
var activeLang = params.get("lang") || "";

document.getElementById("title").innerText = title;
document.title = title;
document.getElementById("dlbtn").href = rawUrl || "#";

function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return "Unknown";
  if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + " KB";
  return bytes + " B";
}

function detectFileSize(u) {
  var badge = document.getElementById("sizeBadge");
  if (sizeParam) { badge.innerText = sizeParam; return; }
  fetch(u, { method: "GET", headers: { "Range": "bytes=0-0" } })
    .then(function(res) {
      var cr = res.headers.get("content-range");
      if (cr) {
        var match = cr.match(/\/(\d+)$/);
        if (match) { badge.innerText = formatBytes(parseInt(match[1])); return; }
      }
      var cl = res.headers.get("content-length");
      if (cl && parseInt(cl) > 1) { badge.innerText = formatBytes(parseInt(cl)); return; }
      badge.innerText = "Unknown";
    })
    .catch(function() { badge.innerText = "Unknown"; });
}

if (rawUrl) detectFileSize(rawUrl);

var qualityBadge = document.getElementById("qualityBadge");
if (title.indexOf("1080") !== -1) qualityBadge.innerText = "1080p";
else if (title.indexOf("720") !== -1) qualityBadge.innerText = "720p";
else if (title.indexOf("480") !== -1) qualityBadge.innerText = "480p";
else if (title.indexOf("360") !== -1) qualityBadge.innerText = "360p";
else qualityBadge.innerText = "HD";

var isFit = false;

var player = videojs("player", {
  sources: [{ src: rawUrl, type: "video/mp4" }],
  controls: true,
  autoplay: true,
  preload: "auto",
  fluid: true,
});

player.on("error", function() {
  player.src({ src: "/api/proxy?url=" + encodeURIComponent(rawUrl), type: "video/mp4" });
  player.play();
});

if (langParam) {
  document.getElementById("langPanel").style.display = "block";
  var langDiv = document.getElementById("langList");
  langDiv.innerHTML = "";
  var langs = langParam.split(",");
  langs.forEach(function(l, idx) {
    var parts = l.split("|");
    var name = parts[0].trim();
    var url = parts[1] ? parts[1].trim() : rawUrl;
    var isActive = activeLang === name || (!activeLang && idx === 0);
    var btn = document.createElement("a");
    btn.className = "lang-btn" + (isActive ? " active" : "");
    btn.innerText = "🔊 " + name;
    var newParams = new URLSearchParams(params);
    newParams.set("url", url);
    newParams.set("lang", name);
    btn.href = "?" + newParams.toString();
    langDiv.appendChild(btn);
  });
}

player.on("loadedmetadata", function() {
  var subDiv = document.getElementById("subTracks");
  var textTracks = player.textTracks();
  var subs = [];
  for (var i = 0; i < textTracks.length; i++) {
    if (textTracks[i].kind === "subtitles" || textTracks[i].kind === "captions") subs.push(textTracks[i]);
  }
  if (subs.length > 0) {
    subDiv.innerHTML = "";
    var offBtn = document.createElement("button");
    offBtn.className = "sub-btn active";
    offBtn.innerText = "❌ Off";
    offBtn.onclick = function() {
      subs.forEach(function(t) { t.mode = "hidden"; });
      document.querySelectorAll(".sub-btn").forEach(function(b) { b.classList.remove("active"); });
      offBtn.classList.add("active");
    };
    subDiv.appendChild(offBtn);
    subs.forEach(function(t, i) {
      var btn = document.createElement("button");
      btn.className = "sub-btn";
      btn.innerText = "💬 " + (t.label || "Subtitle " + (i + 1));
      btn.onclick = function() {
        subs.forEach(function(s) { s.mode = "hidden"; });
        t.mode = "showing";
        document.querySelectorAll(".sub-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
      };
      subDiv.appendChild(btn);
    });
    document.getElementById("langPanel").style.display = "block";
  }
});

function toggleFit() {
  isFit = !isFit;
  var v = document.querySelector("video");
  v.classList.toggle("fit", isFit);
  if (isFit) player.play();
}

function copyLink() {
  if (!rawUrl) return;
  navigator.clipboard.writeText(rawUrl).then(function() {
    var btn = document.getElementById("copyBtn");
    btn.innerText = "✅ Copied!";
    setTimeout(function() { btn.innerText = "📋 Copy Direct Link"; }, 1500);
  });
}
</script>
</body>
</html>
