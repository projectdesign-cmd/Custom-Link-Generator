<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Video Player</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.video-wrap{width:100%;max-width:900px;background:#000;position:relative}
video{width:100%;display:block;background:#000}
.controls{background:#1a1a1a;padding:8px 10px}
.progress-bar{width:100%;height:4px;background:#444;cursor:pointer;margin-bottom:8px;border-radius:2px}
.progress{height:4px;background:red;width:0%;border-radius:2px;pointer-events:none}
.ctrl-row{display:flex;align-items:center;gap:10px}
.ctrl-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:2px 6px}
.time{font-size:12px;color:#aaa;flex:1}
.vol-wrap{display:flex;align-items:center;gap:5px}
.vol-slider{width:60px;accent-color:red}
.info-box{width:100%;max-width:900px;padding:16px}
.file-title{font-size:18px;font-weight:bold;line-height:1.3;margin-bottom:10px}
.meta{display:flex;gap:10px;margin-bottom:16px;align-items:center}
.size-badge{background:#333;color:#fff;font-size:13px;padding:3px 10px;border-radius:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:8px;font-size:16px;font-weight:bold;text-decoration:none;margin-bottom:10px;border:none;cursor:pointer;color:#fff}
.white{background:#fff;color:#000}
.blue{background:#1a73e8}
.dark{background:#333}
.settings-panel{background:#222;border-radius:8px;padding:14px;margin-bottom:10px;display:none}
.settings-panel h3{font-size:14px;color:#aaa;margin-bottom:10px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lang-btn{padding:10px;background:#333;border:none;color:#fff;border-radius:6px;text-align:center;cursor:pointer;font-size:14px}
.lang-btn.active{background:#1a73e8}
.sub-btn{padding:10px;background:#333;border:none;color:#fff;border-radius:6px;text-align:left;cursor:pointer;font-size:14px;width:100%;margin-bottom:6px}
.sub-btn.active{background:#1db954}
</style>
</head>
<body>
<div class="video-wrap">
  <video id="player" playsinline webkit-playsinline x5-playsinline preload="auto"></video>
  <div class="controls">
    <div class="progress-bar" id="progressBar" onclick="seekVideo(event)">
      <div class="progress" id="progress"></div>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <span class="time" id="timeDisplay">00:00 / 00:00</span>
      <div class="vol-wrap">
        <span>🔊</span>
        <input class="vol-slider" type="range" min="0" max="1" step="0.05" value="1" oninput="setVol(this.value)">
      </div>
      <button class="ctrl-btn" onclick="toggleFullscreen()">⛶</button>
    </div>
  </div>
</div>

<div class="info-box">
  <div class="file-title" id="title">Loading...</div>
  <div class="meta">
    <span class="size-badge" id="sizeBadge">HD</span>
    <span style="color:#aaa;font-size:14px">HD</span>
  </div>

  <button class="btn blue" onclick="toggleFullscreen()">⛶ Full Screen</button>
  <button class="btn dark" onclick="toggleSettings()">⚙️ Settings</button>

  <div class="settings-panel" id="settingsPanel">
    <h3>🔊 Audio Language</h3>
    <div class="lang-grid" id="langList">
      <div style="color:#aaa;font-size:13px">No languages provided</div>
    </div>
    <h3>💬 Subtitles</h3>
    <div id="subTracks">
      <div style="color:#aaa;font-size:13px">No subtitles detected</div>
    </div>
  </div>

  <a id="dlbtn" class="btn white" href="#" target="_blank">⬇ Download</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const rawUrl = params.get("url");
const title = params.get("title") || "Video";
const size = params.get("size") || "HD";
const langParam = params.get("langs") || "";
const activeLang = params.get("lang") || "";

document.getElementById("title").innerText = title;
document.title = title;
document.getElementById("sizeBadge").innerText = size;
document.getElementById("dlbtn").href = rawUrl || "#";

const video = document.getElementById("player");
let settingsOpen = false;

// Load video
if(rawUrl){
  video.src = rawUrl;
  video.load();
  video.onerror = () => {
    video.src = "/api/proxy?url=" + encodeURIComponent(rawUrl);
    video.load();
  };
}

// Play/Pause
function togglePlay(){
  if(video.paused){
    video.play();
    document.getElementById("playBtn").innerText = "⏸";
  } else {
    video.pause();
    document.getElementById("playBtn").innerText = "▶";
  }
}

video.onclick = togglePlay;

// Progress
video.ontimeupdate = () => {
  const p = (video.currentTime/video.duration)*100||0;
  document.getElementById("progress").style.width = p+"%";
  document.getElementById("timeDisplay").innerText = fmt(video.currentTime)+" / "+fmt(video.duration);
};

function fmt(s){
  if(!s||isNaN(s)) return "00:00";
  const m=Math.floor(s/60);
  const sec=Math.floor(s%60);
  return (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec;
}

function seekVideo(e){
  const r=e.currentTarget.getBoundingClientRect();
  video.currentTime=(e.clientX-r.left)/r.width*video.duration;
}

function setVol(v){ video.volume=v; }

// Fullscreen - works on mobile!
function toggleFullscreen(){
  if(document.fullscreenElement || document.webkitFullscreenElement){
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    const wrap = document.querySelector(".video-wrap");
    if(wrap.requestFullscreen) wrap.requestFullscreen();
    else if(wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    else if(video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  }
}

// Settings
function toggleSettings(){
  settingsOpen = !settingsOpen;
  document.getElementById("settingsPanel").style.display = settingsOpen ? "block" : "none";
}

// Language buttons
if(langParam){
  const langDiv = document.getElementById("langList");
  langDiv.innerHTML = "";
  const langs = langParam.split(",");
  langs.forEach((l, idx) => {
    const parts = l.split("|");
    const name = parts[0].trim();
    const url = parts[1] ? parts[1].trim() : rawUrl;
    const isActive = activeLang === name || (!activeLang && idx === 0);
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (isActive ? " active" : "");
    btn.innerText = "🔊 " + name;
    btn.onclick = () => {
      video.src = url;
      video.load();
      video.play();
      document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
    };
    langDiv.appendChild(btn);
  });
}

// Subtitles
video.onloadedmetadata = () => {
  const subDiv = document.getElementById("subTracks");
  const tracks = video.textTracks;
  const subs = [];
  for(let i=0; i<tracks.length; i++){
    if(tracks[i].kind==="subtitles"||tracks[i].kind==="captions") subs.push(tracks[i]);
  }
  if(subs.length > 0){
    subDiv.innerHTML = "";
    const offBtn = document.createElement("button");
    offBtn.className = "sub-btn active";
    offBtn.innerText = "❌ Off";
    offBtn.onclick = () => {
      subs.forEach(t=>t.mode="hidden");
      document.querySelectorAll(".sub-btn").forEach(b=>b.classList.remove("active"));
      offBtn.classList.add("active");
    };
    subDiv.appendChild(offBtn);
    subs.forEach((t,i)=>{
      const btn = document.createElement("button");
      btn.className = "sub-btn";
      btn.innerText = "💬 "+(t.label||"Subtitle "+(i+1));
      btn.onclick = () => {
        subs.forEach(s=>s.mode="hidden");
        t.mode="showing";
        document.querySelectorAll(".sub-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
      };
      subDiv.appendChild(btn);
    });
  }
};
</script>
</body>
</html>
