name: Ultra Fast Video Downloader

on:
  push:
    paths:
      - 'links.txt'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  download-and-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg aria2 wget

      - name: Download & Edit Metadata
        run: |
          mkdir -p output
          while IFS= read -r url || [[ -n "$url" ]]; do
            [[ -z "$url" ]] && continue
            [[ "$url" == \#* ]] && continue
            filename=$(basename "$url" | cut -d'?' -f1)
            filename=$(python3 -c "import urllib.parse, sys; print(urllib.parse.unquote_plus(sys.argv[1]))" "$filename")
            ext="${filename##*.}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⬇️ Downloading: $filename"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            wget -O "/tmp/temp_$filename" "$url"
            if [ $? -ne 0 ]; then
              echo "❌ Download failed: $filename"
              continue
            fi
            echo "✏️ Editing Metadata: $filename"
            if [ "$ext" = "mkv" ]; then
              ffmpeg -y \
                -i "/tmp/temp_$filename" \
                -map 0 \
                -map_metadata 0 \
                -metadata:s:a:0 title="Exclusive File Z" \
                -metadata:s:a:0 handler_name="Exclusive File Z" \
                -c copy \
                "output/$filename"
            else
              ffmpeg -y \
                -i "/tmp/temp_$filename" \
                -map 0 \
                -map_metadata 0 \
                -metadata:s:a:0 title="Exclusive File Z" \
                -metadata:s:a:0 handler_name="Exclusive File Z" \
                -c:v copy \
                -c:a copy \
                -c:s mov_text \
                "output/$filename"
            fi
            rm -f "/tmp/temp_$filename"
            echo "✅ Done: $filename"
          done < links.txt

      - name: Upload Edited Videos
        uses: actions/upload-artifact@v4
        with:
          name: Edited-Videos
          path: output/
          retention-days: 7
